[build-system]
requires = ["setuptools>=77,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcast"
version = "0.1.0"
description = "Reproducible traffic forecasting and congestion intelligence pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.3.3",
  "pandas==3.0.3",
  "pyarrow==24.0.0",
  "PyYAML==6.0.3",
  "tzdata==2026.2",
]

[project.optional-dependencies]
eda = [
  "jupyterlab==4.6.1",
  "matplotlib==3.11.1",
  "Pillow==12.3.0",
]
classical = [
  "joblib==1.5.2",
  "scikit-learn==1.9.0",
  "tqdm==4.67.1",
  "xgboost==3.2.0",
]
deep = ["torch==2.13.0"]
dashboard = [
  "matplotlib==3.11.1",
  "plotly==6.9.0",
  "seaborn==0.13.2",
  "streamlit==1.59.2",
]
notebooks = ["jupyterlab==4.6.1"]
test = ["pytest==9.0.2"]

[project.scripts]
flowcast = "flowcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "data_contract: tests that read the delivered source datasets",
]
