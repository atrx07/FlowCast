name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[classical,deep,eda,dashboard,test]"
          python -m pip check

      - name: Verify package version
        run: |
          python - <<'PY'
          import flowcast
          assert flowcast.__version__ == "1.0.0", flowcast.__version__
          print(f"FlowCast {flowcast.__version__}")
          PY

      - name: Run 192-test suite with coverage
        run: |
          python -m pytest -q \
            --cov=flowcast \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowcast-coverage-python-3.11
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 30

  reproducibility:
    name: Reproducible acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install complete project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[classical,deep,eda,dashboard,test]"
          python -m pip check

      - name: Run clean CPU reproduction
        run: |
          python -m flowcast.cli run-all \
            --output-root artifacts/reproductions/ci_v1_cpu \
            --recurrent-device cpu

      - name: Verify reproduction evidence
        run: |
          python -m flowcast.cli verify-reproduction \
            --output-root artifacts/reproductions/ci_v1_cpu

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowcast-v1-reproducibility-evidence
          path: artifacts/reproductions/ci_v1_cpu/
          if-no-files-found: error
          retention-days: 30
