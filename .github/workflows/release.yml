name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install complete project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[classical,deep,eda,dashboard,test]"
          python -m pip check

      - name: Validate tag and package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import flowcast; print(flowcast.__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"
          test "$PACKAGE_VERSION" = "1.0.0"
          echo "Validated FlowCast ${PACKAGE_VERSION}"

      - name: Run complete test suite with coverage
        run: |
          python -m pytest -q \
            --cov=flowcast \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Run clean CPU reproduction
        run: |
          python -m flowcast.cli run-all \
            --output-root artifacts/reproductions/release_v1_cpu \
            --recurrent-device cpu

      - name: Verify reproducibility acceptance
        run: |
          python -m flowcast.cli verify-reproduction \
            --output-root artifacts/reproductions/release_v1_cpu

      - name: Archive release evidence
        run: |
          tar -czf flowcast-v1.0.0-acceptance-evidence.tar.gz \
            coverage.xml htmlcov artifacts/reproductions/release_v1_cpu

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "FlowCast v1.0.0" \
            --generate-notes \
            --verify-tag \
            flowcast-v1.0.0-acceptance-evidence.tar.gz
