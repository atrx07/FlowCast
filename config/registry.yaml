classical_registry:
  contract_version: classical_registry_v1
  version: classical_registry_v1
  upstream:
    regression_version: classical_regression_v1
    classification_version: classical_classification_v1
  horizons: [1, 2, 3, 4]
  targets:
    - key: volume
      source: regression
      task_type: regression
      primary_metric: rmse
      direction: minimize
      acceptance_metric: mape_percent
      acceptance_operator: less_than_or_equal
      acceptance_value: 12.0
    - key: speed
      source: regression
      task_type: regression
      primary_metric: rmse
      direction: minimize
    - key: travel_time
      source: regression
      task_type: regression
      primary_metric: rmse
      direction: minimize
    - key: congestion
      source: classification
      task_type: classification_multiclass
      primary_metric: macro_f1
      direction: maximize
      acceptance_metric: macro_f1
      acceptance_operator: greater_than_or_equal
      acceptance_value: 0.80
    - key: accident
      source: classification
      task_type: classification_binary
      primary_metric: roc_auc
      direction: maximize
      acceptance_metric: roc_auc
      acceptance_operator: greater_than_or_equal
      acceptance_value: 0.75
  prediction_mapping: indexed_source_manifest
  registry_key_template: "{target}/h{horizon}/{family}/{model_version}"
