feature_contract_version: explanatory_features_v1
version: engineered_features_v1

keys: [road_id, timestamp]
forecast_horizons_reserved: [1, 2, 3, 4]

temporal:
  peak_periods:
    - name: morning
      start: "07:00"
      end: "10:00"
    - name: evening
      start: "17:00"
      end: "20:00"

history:
  lag_windows: [1, 2, 48]
  rolling_windows: [4, 8]

capacity:
  windows_per_hour: 2

weather:
  rain_minimum_mm_exclusive: 0.0
  low_visibility_below_metres: 1000.0
  categories: [Clear, Cloudy, Overcast, Rain, Fog]
  temperature_boundaries_celsius: [15.0, 25.0]
  temperature_labels: [cool, mild, warm]

calendar:
  event_proximity_days: 1

targets:
  contract_version: multi_horizon_targets_v1
  processed_version: processed_targets_v1
  cadence_minutes: 30
  definitions:
    - name: volume
      source_column: traffic_volume
      task: regression
    - name: speed
      source_column: avg_speed
      task: regression
    - name: travel_time
      source_column: travel_time
      task: regression
    - name: congestion
      source_column: congestion_level
      task: classification_multiclass
    - name: accident
      source_column: accident_count
      task: classification_binary
      availability_source: _accident_observed
