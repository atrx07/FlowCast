model_contract_version: split_preprocessing_v1
version: split_preprocessing_v1

split:
  cadence_minutes: 30
  allocation_method: largest_remainder
  ratios:
    train: 0.70
    validation: 0.15
    test: 0.15
  partitions:
    train:
      timestamp_count: 5074
      start: "2025-01-01T00:00:00+05:30"
      end: "2025-04-16T16:30:00+05:30"
    validation:
      timestamp_count: 1087
      start: "2025-04-16T17:00:00+05:30"
      end: "2025-05-09T08:00:00+05:30"
    test:
      timestamp_count: 1087
      start: "2025-05-09T08:30:00+05:30"
      end: "2025-05-31T23:30:00+05:30"
  target_boundary_policy: target_timestamp_within_origin_partition

cross_validation:
  strategy: expanding_window
  fold_count: 5
  validation_windows: 336
  gap_windows: 4

access:
  default_purpose: tuning
  final_evaluation_purpose: final_evaluation

preprocessing:
  categorical_encoding: one_hot_ignore_unknown
  numeric_imputation: median
  categorical_imputation: most_frequent
  binary_imputation: most_frequent
  explicit_binary_features:
    - public_holiday
    - event_flag
    - roadwork_flag
  bounded_numeric_features:
    - occupancy
    - visibility
    - share_2w
    - share_car
    - share_lcv
    - share_hcv
    - hour_of_day
    - day_of_week
    - days_to_nearest_event
  families:
    linear:
      numeric_scaling: standard
      bounded_scaling: standard
    tree:
      numeric_scaling: none
      bounded_scaling: none
    svm:
      numeric_scaling: standard
      bounded_scaling: standard
    recurrent:
      numeric_scaling: standard
      bounded_scaling: minmax

scratch_linear:
  contract_version: scratch_linear_v1
  version: scratch_linear_v1
  target: target_volume_h1
  availability_column: target_volume_h1_available
  horizon_within_split_column: target_within_split_h1
  training_subset:
    method: earliest_chronological
    row_limit: 25000
  optimizer:
    learning_rate: 0.04
    max_iterations: 5000
    tolerance: 1.0e-6
    patience: 25
    initialization_scale: 0.01
  gradient_check:
    epsilon: 1.0e-6
    absolute_tolerance: 1.0e-6
    relative_tolerance: 1.0e-5
  synthetic_proof:
    rows: 256
    features: 5
    learning_rate: 0.1
    max_iterations: 1000
    tolerance: 1.0e-12
    patience: 25
    initialization_scale: 0.01
    coefficient_tolerance: 1.0e-5

classical_regression:
  contract_version: classical_regression_v1
  version: classical_regression_v1
  targets:
    - volume
    - speed
    - travel_time
  horizons: [1, 2, 3, 4]
  primary_metric: rmse
  cross_validation:
    fold_count: 5
    training_timestamp_budget: 96
    sampling: evenly_spaced_timestamps
    require_all_folds: true
  selection:
    hyperparameter_stage: mean_cv_rmse_within_family
    family_stage: validation_rmse
    tie_breakers:
      - mean_cv_rmse
      - family
      - candidate_id
    freeze_before_test: true
  estimators:
    linear_regression:
      preprocessing_family: linear
      candidates:
        - candidate_id: linear_default
          parameters: {}
    decision_tree:
      preprocessing_family: tree
      candidates:
        - candidate_id: tree_balanced
          parameters:
            max_depth: 8
            min_samples_leaf: 12
        - candidate_id: tree_deep
          parameters:
            max_depth: 14
            min_samples_leaf: 6
    random_forest:
      preprocessing_family: tree
      candidates:
        - candidate_id: forest_balanced
          parameters:
            n_estimators: 12
            max_depth: 10
            min_samples_leaf: 8
            max_features: 0.7
        - candidate_id: forest_deep
          parameters:
            n_estimators: 24
            max_depth: 14
            min_samples_leaf: 4
            max_features: 0.9
    xgboost:
      preprocessing_family: tree
      candidates:
        - candidate_id: xgb_balanced
          parameters:
            n_estimators: 24
            max_depth: 4
            learning_rate: 0.1
            min_child_weight: 4
            subsample: 1.0
            colsample_bytree: 1.0
        - candidate_id: xgb_deep
          parameters:
            n_estimators: 40
            max_depth: 6
            learning_rate: 0.06
            min_child_weight: 3
            subsample: 1.0
            colsample_bytree: 1.0

classical_classification:
  contract_version: classical_classification_v1
  version: classical_classification_v1
  tasks:
    - congestion
    - accident
  horizons: [1, 2, 3, 4]
  class_order:
    congestion:
      - Free-flow
      - Moderate
      - Heavy
      - Severe
    accident:
      - no_accident
      - accident
  primary_metrics:
    congestion: macro_f1
    accident: roc_auc
  cross_validation:
    fold_count: 5
    training_timestamp_budget: 96
    sampling: evenly_spaced_timestamps
    require_all_folds: true
  selection:
    hyperparameter_stage:
      congestion: mean_cv_macro_f1_within_family
      accident: mean_cv_roc_auc_within_family
    family_stage:
      congestion: validation_macro_f1
      accident: validation_roc_auc
    tie_breakers:
      - family
      - candidate_id
    freeze_before_test: true
  probability:
    calibration:
      method: sigmoid
      validation_fit_fraction: 0.50
      assessment_metric: brier_score
      minimum_improvement: 0.0001
  accident_threshold:
    selection_metric: f1
    candidate_quantiles: 201
    include_default_threshold: 0.50
    tie_breakers:
      - recall
      - precision
      - lower_threshold
  estimators:
    decision_tree:
      preprocessing_family: tree
      candidates:
        - candidate_id: tree_balanced
          parameters:
            max_depth: 10
            min_samples_leaf: 12
        - candidate_id: tree_deep
          parameters:
            max_depth: 16
            min_samples_leaf: 6
    random_forest:
      preprocessing_family: tree
      candidates:
        - candidate_id: forest_balanced
          parameters:
            n_estimators: 24
            max_depth: 12
            min_samples_leaf: 6
            max_features: 0.7
        - candidate_id: forest_deep
          parameters:
            n_estimators: 48
            max_depth: 18
            min_samples_leaf: 3
            max_features: 0.9
    xgboost:
      preprocessing_family: tree
      candidates:
        - candidate_id: xgb_balanced
          parameters:
            n_estimators: 40
            max_depth: 4
            learning_rate: 0.10
            min_child_weight: 5
            subsample: 1.0
            colsample_bytree: 1.0
        - candidate_id: xgb_deep
          parameters:
            n_estimators: 64
            max_depth: 6
            learning_rate: 0.06
            min_child_weight: 3
            subsample: 1.0
            colsample_bytree: 1.0
    svm:
      preprocessing_family: svm
      candidates:
        - candidate_id: svm_regularized
          parameters:
            C: 0.1
            max_iter: 5000
            tol: 0.001
        - candidate_id: svm_default
          parameters:
            C: 1.0
            max_iter: 5000
            tol: 0.001
